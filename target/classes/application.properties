
# ============================================================
# Server Configuration
# ============================================================
server.port=${SERVER_PORT:8082}
server.address=0.0.0.0
server.servlet.context-path=/api

# URL base para construir URLs absolutas (imágenes, etc.)
api.base.url=${API_BASE_URL:https://34.26.49.182}

# ============================================================
# CORS Configuration (usando AppConfig)
# ============================================================
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:https://34.26.49.182,http://localhost:3000,http://localhost:8085}
app.cors.allowed-origin=${cors.allowed.origins}

# ============================================================
# Upload directory
# ============================================================
upload.path=${UPLOAD_PATH:uploads}
file.upload-dir=${UPLOAD_PATH:uploads}

# ============================================================
# Database Configuration
# ============================================================
db.host=${DB_HOST:localhost}
db.port=${DB_PORT:3306}
db.name=${DB_NAME:car_dealer}

spring.datasource.url=jdbc:mysql://${db.host}:${db.port}/${db.name}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:iotmanager}
spring.datasource.password=${DB_PASSWORD:Alfra-0922}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# JPA Configuration
# ============================================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ============================================================
# File Upload
# ============================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:100MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:200MB}

# ============================================================
# NHTSA API
# ============================================================
nhtsa.api.base-url=${NHTSA_API_URL:https://vpic.nhtsa.dot.gov/api}
nhtsa.recalls.base-url=${NHTSA_RECALLS_URL:https://api.nhtsa.gov}
nhtsa.timeout=${NHTSA_TIMEOUT:30000}

# ============================================================
# Logging
# ============================================================
logging.level.com.cardealer.iotproject=${LOG_LEVEL:DEBUG}
logging.level.org.springframework.web=${SPRING_LOG_LEVEL:INFO}
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LEVEL:DEBUG}

# ============================================================
# Hibernate Configuration
# ============================================================
# spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

# ============================================================
# Jackson Configuration
# ============================================================
spring.jackson.serialization.fail-on-empty-beans=false

# ============================================================
# Static Resources
# ============================================================
spring.web.resources.static-locations=file:${upload.path}/,classpath:/static/
spring.web.resources.add-mappings=true